<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match Fixtures – MMN Golden Boys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!-- ===== HEADER STYLES ===== -->
<style>
.header-banner-img {
    width: 100%;
    height: 160px;
    overflow: hidden;
    border-radius: 18px 18px 0 0;
    position: relative;
}
.header-banner-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
}
.back-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 4px 12px;
    font-weight: 500;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    border: none;
}
@media (max-width: 576px) {
    .header-banner-img { height: 110px; }
    .back-btn { font-size: 0.85rem; top: 8px; right: 8px; }
}
</style>

<!-- ===== PAGE STYLES ===== -->
<style>
body {
    background:#f4f6f9;
    font-family:"Segoe UI",sans-serif;
    padding:5px;
}
.main-card {
    max-width:900px;
    margin:auto;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,0.15);
    overflow:hidden;
    background:#fff;
}
.week-title {
    font-weight:700;
    margin-top:25px;
    margin-bottom:8px;
}
.table-responsive {
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
table th {
    background:#e8f3ff;
    font-weight:600;
    white-space:nowrap;
}
table td {
    vertical-align:middle;
    white-space:nowrap;
}
.vs {
    font-weight:700;
    color:#dc3545;
}
.group-badge {
    background:#e3f2fd;
    padding:4px 8px;
    border-radius:12px;
    font-size:0.75rem;
    font-weight:600;
}
#loadingOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
#loadingOverlay img {
    width: 100px;
    height: 100px;
}
</style>
</head>

<body>

<div class="main-card">

    <!-- HEADER -->
    <div class="header-banner-img">
        <img src="banner.jpg" alt="MMN Golden Boys Champions Trophy">
        <button class="btn btn-light btn-sm back-btn"
                onclick="window.location.assign('index.html')">
            ← Back
        </button>
    </div>

    <!-- BODY -->
    <div class="card-body p-4">
        <h5>📅 Match Fixtures</h5>
        <p class="text-muted small mb-3">
            Starts from <b>15 Feb 2026</b>
        </p>

        <div id="fixturesContainer"></div>

        <div class="text-center text-muted small mt-4">
            © 2026 Golden Boys
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <img src="PercentLoading.gif" alt="Loading...">
    </div>

</div>

<script>
const apiURL = "https://script.google.com/macros/s/AKfycbwE-fiDQn2TzNlDSNLi4m42J6f9lZQcoJZ20Kc8fDKJd3ejt8MPhozOXqn3_YRHJ9Ovdw/exec";
let teamMap = {};

// Load Teams
async function loadTeams() {
    const res = await fetch(apiURL + "?action=getTeamsWithNo");
    const data = await res.json();
    data.forEach(t => teamMap[t.TeamNo] = t.TeamName);
}

// Load Fixtures (READ ONLY)
async function loadFixtures() {
    const res = await fetch(apiURL + "?action=getMatchFixtures");
    const data = await res.json();

    const container = document.getElementById("fixturesContainer");
    container.innerHTML = "";

    let currentWeek = "";

    data.forEach(m => {

        if (m.Week !== currentWeek) {
            currentWeek = m.Week;
            const weekId = currentWeek.replace(/\s+/g, '');

            container.innerHTML += `
                <div class="week-title">${currentWeek}</div>
                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-sm mb-0">
                        <thead>
                            <tr>
                                <th>Match</th>
                                <th>Group</th>
                                <th>Team A</th>
                                <th></th>
                                <th>Team B</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-${weekId}"></tbody>
                    </table>
                </div>
            `;
        }

        const tbody = document.getElementById(
            `tbody-${currentWeek.replace(/\s+/g,'')}`
        );

        tbody.innerHTML += `
            <tr>
                <td>${m.MatchNo}</td>
                <td><span class="group-badge">${m.Group}</span></td>
                <td>${teamMap[m.TeamA] || m.TeamA}</td>
                <td class="vs">VS</td>
                <td>${teamMap[m.TeamB] || m.TeamB}</td>
                <td>${m.Date || '-'}</td>
                <td>${m.Time || '-'}</td>
            </tr>
        `;
    });

    hideLoading();
}

// INIT
(async function(){
    showLoading();
    await loadTeams();
    await loadFixtures();
})();

function showLoading() {
    const o = document.getElementById('loadingOverlay');
    if (o) o.style.display = 'flex';
}
function hideLoading() {
    const o = document.getElementById('loadingOverlay');
    if (o) o.style.display = 'none';
}
</script>

</body>
</html>
