<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Points Table – MMN Golden Boys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
	body{
		background:#f4f6f9;
		font-family:"Segoe UI",sans-serif;
		margin:0;
	}

	/* Compact Card */
	.main-card{
		max-width:700px;
		margin:10px auto;
		border-radius:14px;
		overflow:hidden;
		box-shadow:0 6px 18px rgba(0,0,0,0.12);
	}

	/* Compact Banner */
	.header-banner-img img{
		width:100%;
		height:120px;
		object-position: center top;
		object-fit:cover;
	}

	/* Compact table */
	.table{
		font-size:14px;
	}

	.table thead{
		background:#ffc107;
		font-size:13px;
	}

	.table th, .table td{
		padding:6px !important;
	}

	.top-team{
		background:#d4edda !important;
		font-weight:600;
	}

	/* Buttons compact */
	.group-buttons .btn{
		padding:4px 10px;
		font-size:13px;
	}

	/* Qualified list compact */
	#qualifiedList li{
		padding:6px 10px;
		font-size:14px;
	}

	@media(max-width:576px){
		.main-card{
			margin:5px;
		}
		.header-banner-img img{
			height:90px;
		}
		.table{
			font-size:12px;
		}
	}

	#loadingOverlay {
	  position: fixed;
	  top: 0; left: 0;
	  width: 100%; height: 100%;
	  background: rgba(255,255,255,0.7);
	  display: none;
	  align-items: center;
	  justify-content: center;
	  z-index: 9999;
	}

	#loadingOverlay img {
	  width: 100px;
	  height: 100px;
	}
		
		
</style>
</head>
<body>

<div class="card main-card">

<div class="header-banner-img">
    <img src="banner.jpg">
</div>

<div class="card-body p-2">

<h6 class="text-center mb-2 fw-bold">🏆 Points Table</h6>

<div class="text-center mb-2 group-buttons">
    <button id="btnA" class="btn btn-warning btn-sm" onclick="loadGroup('A')">Group A</button>
    <button id="btnB" class="btn btn-outline-warning btn-sm" onclick="loadGroup('B')">Group B</button>
</div>

<div class="table-responsive">
	<table class="table table-bordered text-center align-middle mb-2">
		<thead>
			<tr>
			<th>Sl</th>
			<th>Team</th>
			<th>P</th>
			<th>W</th>
			<th>L</th>
			<th>NR</th>
			<th>Pts</th>
			<th>NRR</th>
			</tr>
		</thead>
	<tbody id="pointsBody"></tbody>
	</table>
</div>

	<div>
		<h6 class="fw-bold text-success mb-2 text-center">Qualified (Semis)</h6>
		<ul id="qualifiedList" class="list-group"></ul>
	</div>
		
	<div id="loadingOverlay">
	  <img src="PercentLoading.gif" alt="Loading...">
	</div>
	  
	<div class="footer-text mt-4">
		© 2026 Golden Boys
	</div>
		
</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwE-fiDQn2TzNlDSNLi4m42J6f9lZQcoJZ20Kc8fDKJd3ejt8MPhozOXqn3_YRHJ9Ovdw/exec";

let currentGroup = "A";
let teamMap = {};
let groupMap = {};

async function loadTeams() {
	showLoading();
    const res = await fetch(API_URL + "?action=getTeamsWithNo");
    const data = await res.json();

    data.forEach(t => {
        teamMap[t.TeamNo] = t.TeamName;
        groupMap[t.TeamNo] = t.Group;
    });
}

function loadGroup(group){
	showLoading();
    currentGroup = group;

    // Toggle active button style
    document.getElementById("btnA").className =
        group === "A"
        ? "btn btn-warning btn-sm"
        : "btn btn-outline-warning btn-sm";

    document.getElementById("btnB").className =
        group === "B"
        ? "btn btn-warning btn-sm"
        : "btn btn-outline-warning btn-sm";

    fetchPoints();

}

function fetchPoints(){
    fetch(API_URL + "?action=getPointsTable&group=" + currentGroup)
    .then(res=>res.json())
    .then(data=>{
        renderTable(data.points);
        renderQualified(data.qualified);
    });
}



function renderTable(data){
    let tbody = document.getElementById("pointsBody");
    tbody.innerHTML="";

    data.forEach((row,index)=>{

        let teamName = teamMap[row.team] || row.team;

        let tr = `<tr class="${index<4?'top-team':''}">
            <td>${index+1}</td>
            <td class="text-start fw-semibold">
				${teamName}
				<span class="badge bg-secondary ms-1">${groupMap[row.team]}</span>
			</td>
            <td>${row.played}</td>
            <td>${row.win}</td>
            <td>${row.loss}</td>
            <td>${row.nr}</td>
            <td>${row.points}</td>
            <td>${Number(row.nrr).toFixed(3)}</td>
        </tr>`;

        tbody.innerHTML+=tr;
    });
	hideLoading();
}

function renderQualified(list){
    let ul = document.getElementById("qualifiedList");
    ul.innerHTML="";

    list.forEach(item=>{
        let teamName = teamMap[item.team] || item.team;
        ul.innerHTML+=`
            <li class="list-group-item fw-semibold text-center">
                ${teamName} <span class="text-muted">(Group ${item.group})</span>
            </li>`;
    });
}

setInterval(fetchPoints,60000);

(async function(){
    await loadTeams();
    loadGroup("A");   // Default load Group A
})();


function showLoading() {
  document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

</script>

</body>
</html>
